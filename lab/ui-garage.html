<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>車庫（UI 草案）</title>
<style>
  :root { --accent: #ff3b30; --glass: rgba(8, 12, 22, 0.62); --line: rgba(255, 255, 255, 0.12); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #e9eef8;
    font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
  .bg { position: fixed; inset: 0; background: url(ui-assets/garage-bg.jpg) center / cover; filter: saturate(0.9) brightness(0.85); }
  .vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 60%, transparent 35%, rgba(0,0,0,0.75) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.6)); }
  canvas#car { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* grok's glyphs, made white PNGs with alpha (icons_to_png): a mask that takes any colour. */
  .icon { display: inline-block; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }

  /* top bar */
  .brand { position: fixed; left: 3vw; top: 3.2vh; display: flex; align-items: center; gap: 0.9vw; }
  .brand .icon { width: 3.4vw; height: 3.4vw; color: var(--accent); filter: drop-shadow(0 0 0.6vw var(--accent)); }
  .brand .name { font: italic 900 1.7vw/1 system-ui, sans-serif; letter-spacing: 0.15vw; }
  .brand .name small { display: block; font: 600 0.8vw/1.8 "Microsoft JhengHei", sans-serif; letter-spacing: 0.15vw; color: #8fa0bd; font-style: normal; }

  /* car classes, left */
  .classes { position: fixed; left: 3vw; top: 17vh; width: 19vw; display: flex; flex-direction: column; gap: 1.2vh; }
  .cls { position: relative; display: grid; grid-template-columns: 6.5vw 1fr; align-items: center; gap: 0.8vw; padding: 2vh 1.1vw 2vh 1.2vw;
    background: var(--glass); border: 1px solid var(--line); border-radius: 0.6vw; backdrop-filter: blur(6px); cursor: pointer; transition: transform 0.15s; }
  .cls:hover { transform: translateX(0.3vw); }
  .cls .icon { width: 6.5vw; height: 3.4vw; color: #8693ab; }
  .cls .t { font-size: 1.25vw; font-weight: 800; }
  .cls.sel { border-color: var(--accent); box-shadow: 0 0 1.4vw -0.3vw var(--accent), inset 0.35vw 0 0 var(--accent); }
  .cls.sel .icon { color: #fff; }

  /* stats, right */
  .spec { position: fixed; right: 3vw; top: 17vh; width: 23vw; padding: 2.4vh 1.6vw; background: var(--glass); border: 1px solid var(--line);
    border-radius: 0.8vw; backdrop-filter: blur(8px); }
  .spec h1 { margin: 0 0 1.2vh; font: italic 900 2.6vw/1.1 system-ui, "Microsoft JhengHei", sans-serif; }
  .stat { display: grid; grid-template-columns: 2.2vw 1fr; align-items: center; gap: 0.8vw; margin: 2vh 0; }
  .stat .icon { width: 2vw; height: 2vw; color: var(--accent); grid-row: span 2; }
  .stat .v { justify-self: end; font: italic 800 1.15vw/1 system-ui, sans-serif; }
  .bar { height: 0.55vh; background: rgba(255,255,255,0.08); border-radius: 1vh; overflow: hidden; margin-top: 0.6vh; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, #fff), var(--accent)); box-shadow: 0 0 0.8vw var(--accent); transition: width 0.3s; }

  /* rivals + start, bottom */
  .bottom { position: fixed; left: 3vw; right: 3vw; bottom: 3.5vh; display: flex; align-items: flex-end; gap: 1.2vw; }
  .rivals { flex: 1; }
  .tools { display: flex; gap: 0.6vw; margin-bottom: 1vh; }
  .tool { width: 3.2vw; height: 3.2vw; padding: 0; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line);
    border-radius: 0.5vw; color: #b9c4d8; cursor: pointer; backdrop-filter: blur(6px); }
  .tool:hover { color: #fff; border-color: var(--accent); }
  .tool .icon { width: 2.2vw; height: 2.2vw; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.8vw; }
  .slot { display: grid; grid-template-columns: 1.4vw 1fr 1.4vw; align-items: center; padding: 1vh 0.6vw; background: var(--glass);
    border: 1px solid var(--line); border-radius: 0.6vw; border-top: 0.35vh solid var(--c); backdrop-filter: blur(6px); }
  .slot .arrow { color: #6f7d96; font-size: 1vw; text-align: center; cursor: pointer; }
  .slot .mid { text-align: center; }
  .slot .icon { width: 6vw; height: 3vw; color: var(--c); }
  .go { flex: 0 0 15vw; height: 9vh; border: 0; border-radius: 0.7vw; background: var(--accent); color: #fff; cursor: pointer;
    font: italic 900 1.9vw/1 system-ui, "Microsoft JhengHei", sans-serif; letter-spacing: 0.3vw; box-shadow: 0 0 2.4vw -0.4vw var(--accent); }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="car"></canvas>
<div class="vignette"></div>

<div class="brand"><span class="icon" style="--src:url(ui-assets/emblem.png)"></span><div class="name">HIGHWAY THUNDER 2</div></div>

<div class="classes" id="classes"></div>
<div class="spec" id="spec"></div>

<div class="bottom">
  <div class="rivals">
    <div class="tools">
      <button class="tool" title="隨機"><span class="icon" style="--src:url(ui-assets/icon-random.png)"></span></button>
      <button class="tool" title="同我"><span class="icon" style="--src:url(ui-assets/icon-same.png)"></span></button>
    </div>
    <div class="slots" id="slots"></div>
  </div>
  <button class="go">開始比賽</button>
</div>

<script type="module">
  import * as THREE from 'three';
  import { buildCar } from '/src/vehicles/models.ts';

  // The three cars, with their measured numbers (training/cornering.train.ts).
  const CARS = {
    'street-racer': { name: '超跑', style: 'super', color: 0xd62828, accent: '#ff3b30', tag: '加速快、極速最高', icon: 'icon-super',
      stats: [['icon-accel', '加速', '0–100 4.2 秒', 0.8], ['icon-topspeed', '極速', '300 km/h', 1], ['icon-handling', '操控', '2.1 g', 0.75]] },
    'muscle-car': { name: '肌肉車', style: 'muscle', color: 0x2b2f3a, accent: '#ff9f1a', tag: '加速最快、懸吊軟、容易甩尾', icon: 'icon-muscle',
      stats: [['icon-accel', '加速', '0–100 4.0 秒', 1], ['icon-topspeed', '極速', '259 km/h', 0.75], ['icon-handling', '操控', '1.4 g', 0.45]] },
    jdm: { name: '改裝車', style: 'jdm', color: 0x3a8dde, accent: '#2f9bff', tag: 'JDM 風格、轉彎最強、精準', icon: 'icon-jdm',
      stats: [['icon-accel', '加速', '0–100 4.0 秒', 0.75], ['icon-topspeed', '極速', '245 km/h', 0.6], ['icon-handling', '操控', '2.4 g', 1]] },
  };
  const RIVAL_COLORS = ['#1e88e5', '#ffb300', '#8e24aa', '#00c853', '#00bcd4'];
  const rivals = ['street-racer', 'muscle-car', 'jdm', 'street-racer', 'muscle-car'];
  const icon = (name, cls = '') => `<span class="icon ${cls}" style="--src:url(ui-assets/${name}.png)"></span>`;
  let picked = new URLSearchParams(location.search).get('car') ?? 'street-racer';

  function draw() {
    const c = CARS[picked];
    document.documentElement.style.setProperty('--accent', c.accent);
    document.getElementById('classes').innerHTML = Object.entries(CARS).map(([id, k]) =>
      `<div class="cls ${id === picked ? 'sel' : ''}" data-id="${id}">${icon(k.icon, 'car')}<div class="t">${k.name}</div></div>`).join('');
    document.getElementById('spec').innerHTML = `
      <h1>${c.name}</h1>
      ${c.stats.map(([ic, , v, f]) => `<div class="stat">${icon(ic)}<span class="v">${v}</span><div class="bar"><i style="width:${f * 100}%"></i></div></div>`).join('')}`;
    document.getElementById('slots').innerHTML = rivals.map((id, i) =>
      `<div class="slot" style="--c:${RIVAL_COLORS[i]}"><span class="arrow">◀</span><div class="mid">${icon(CARS[id].icon, 'car')}</div><span class="arrow">▶</span></div>`).join('');
    document.querySelectorAll('.cls').forEach((e) => (e.onclick = () => { picked = e.dataset.id; draw(); showCar(); }));
  }

  // The car itself: the game's own model, under the lamp, slowly turning.
  const canvas = document.getElementById('car');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
  camera.position.set(0, 1.6, 17.5);
  camera.lookAt(0, 0.55, 0);
  scene.add(new THREE.HemisphereLight(0x6f86c8, 0x1a1208, 0.6));
  const lamp = new THREE.SpotLight(0xffb36b, 120, 30, 0.7, 0.6, 1.6);
  lamp.position.set(2.5, 7, 1);
  scene.add(lamp, lamp.target);
  const rim = new THREE.DirectionalLight(0x6fa8ff, 1.4);
  rim.position.set(-6, 3, -6);
  scene.add(rim);
  // A soft contact shadow: dark in the middle, fading out.
  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const sg = sc.getContext('2d');
  const grad = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(0,0,0,0.85)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.5)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sg.fillStyle = grad;
  sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -0.64; // under the car (a child of it: it turns with it)
  let car = null;
  function showCar() {
    if (car) scene.remove(car);
    const c = CARS[picked];
    car = buildCar(1.86, 1.3, 4.4, c.color, c.style, true, false).root;
    car.position.y = 0.65;
    car.add(shadow);
    scene.add(car);
  }
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    // The car sits low in the middle of the screen, on the empty parking spot.
    camera.setViewOffset(innerWidth, innerHeight, 0, -innerHeight * 0.12, innerWidth, innerHeight);
  }
  addEventListener('resize', resize);
  resize();
  draw();
  showCar();
  const t0 = performance.now();
  renderer.setAnimationLoop((now) => {
    car.rotation.y = 2.3 + ((now - t0) / 1000) * 0.25 * (window.__spin ?? 1); // nose (-z) toward the camera, three-quarter
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
