<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>車庫（UI 草案）</title>
<style>
  :root { --accent: #ff3b30; --glass: rgba(8, 12, 22, 0.62); --line: rgba(255, 255, 255, 0.12); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; color: #e9eef8;
    font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
  .bg { position: fixed; inset: 0; background: url(/ui/garage-bg.jpg) center / cover; filter: saturate(0.9) brightness(0.85); }
  .vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 60%, transparent 35%, rgba(0,0,0,0.75) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.6), transparent 30%, transparent 70%, rgba(0,0,0,0.6)); }
  canvas#car { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* grok's glyphs, made white PNGs with alpha (icons_to_png): a mask that takes any colour. */
  .icon { display: inline-block; background: currentColor; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }

  /* top bar */
  .brand { position: fixed; left: 3vw; top: 3.2vh; display: flex; align-items: center; gap: 0.9vw; }
  .brand .icon { width: 3.4vw; height: 3.4vw; color: var(--accent); filter: drop-shadow(0 0 0.6vw var(--accent)); }
  .brand .name { font: italic 900 1.7vw/1 system-ui, sans-serif; letter-spacing: 0.15vw; }
  .brand .name small { display: block; font: 600 0.8vw/1.8 "Microsoft JhengHei", sans-serif; letter-spacing: 0.15vw; color: #8fa0bd; font-style: normal; }

  /* car classes, left */
  .classes { position: fixed; left: 3vw; top: 17vh; width: 19vw; display: flex; flex-direction: column; gap: 1.2vh; }
  .cls { position: relative; display: grid; grid-template-columns: 6.5vw 1fr; align-items: center; gap: 0.8vw; padding: 2vh 1.1vw 2vh 1.2vw;
    background: var(--glass); border: 1px solid var(--line); border-radius: 0.6vw; backdrop-filter: blur(6px); cursor: pointer; transition: transform 0.15s; }
  .cls:hover { transform: translateX(0.3vw); }
  .cls .icon { width: 6.5vw; height: 3.4vw; color: #8693ab; }
  .cls .t { font-size: 1.25vw; font-weight: 800; }
  .cls.sel { border-color: var(--accent); box-shadow: 0 0 1.4vw -0.3vw var(--accent), inset 0.35vw 0 0 var(--accent); }
  .cls.sel .icon { color: #fff; }

  /* stats, right */
  .spec { position: fixed; right: 3vw; top: 17vh; width: 23vw; padding: 2.4vh 1.6vw; background: var(--glass); border: 1px solid var(--line);
    border-radius: 0.8vw; backdrop-filter: blur(8px); }
  .spec h1 { margin: 0 0 1.2vh; font: italic 900 2.6vw/1.1 system-ui, "Microsoft JhengHei", sans-serif; }
  .stat { display: grid; grid-template-columns: 2.2vw 1fr; align-items: center; gap: 0.8vw; margin: 2vh 0; }
  .stat > [data-tip] { grid-row: span 2; line-height: 0; cursor: help; outline: none; }
  .stat .icon { width: 2vw; height: 2vw; color: var(--accent); }
  .stat .v { justify-self: end; font: italic 800 1.15vw/1 system-ui, sans-serif; }
  .bar { height: 0.55vh; background: rgba(255,255,255,0.08); border-radius: 1vh; overflow: hidden; margin-top: 0.6vh; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 45%, #fff), var(--accent)); box-shadow: 0 0 0.8vw var(--accent); transition: width 0.3s; }

  /* the race at a glance + start, bottom: the settings themselves are in the pop-up */
  .bottom { position: fixed; left: 3vw; right: 3vw; bottom: 3.5vh; display: flex; align-items: flex-end; justify-content: space-between; gap: 1.2vw; }
  .race { display: flex; align-items: center; gap: 1.6vw; padding: 1.4vh 1.4vw; background: var(--glass); border: 1px solid var(--line); border-radius: 0.7vw;
    backdrop-filter: blur(6px); color: #e9eef8; font: inherit; cursor: pointer; transition: border-color 0.15s; }
  .race:hover, .race:focus-visible { border-color: var(--accent); outline: none; }
  .race .item { display: flex; align-items: center; gap: 0.6vw; font-size: 1vw; font-weight: 700; }
  .race .item > .icon { width: 1.8vw; height: 1.8vw; color: #8fa0bd; }
  .race .sep { width: 1px; height: 4vh; background: var(--line); }
  /* The rivals as a line-up: each car type's silhouette (as in the car list) and how many. */
  .race .count { display: inline-flex; align-items: center; gap: 0.2vw; margin-left: 0.4vw; font: italic 800 1vw/1 system-ui, sans-serif; }
  .race .count .icon.mini { width: 3.4vw; height: 1.7vw; color: #eef3fb; }
  .race .edit { color: var(--accent); font-size: 1.2vw; }

  /* the race settings pop-up */
  .back { position: fixed; inset: 0; display: none; place-items: center; background: rgba(2, 4, 10, 0.6); backdrop-filter: blur(3px); }
  .back.open { display: grid; }
  .modal { position: relative; width: 58vw; padding: 6.4vh 2.2vw 2.6vh; background: rgba(10, 14, 24, 0.92); border: 1px solid var(--line);
    border-top: 0.4vh solid var(--accent); border-radius: 0.9vw; box-shadow: 0 2vh 6vh rgba(0,0,0,0.6); }
  .close { position: absolute; right: 1.2vw; top: 1.6vh; width: 2.4vw; height: 2.4vw; border: 0; border-radius: 50%; background: rgba(255,255,255,0.06);
    color: #b9c4d8; font-size: 1.3vw; cursor: pointer; }
  .close:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .row { display: grid; grid-template-columns: 3vw 1fr; align-items: center; gap: 1vw; margin: 2.2vh 0; }
  .row > .icon { width: 2.2vw; height: 2.2vw; color: var(--accent); justify-self: center; }
  .seg { display: flex; gap: 0.5vw; }
  .seg button { flex: 1; padding: 1.3vh 0; border: 1px solid var(--line); border-radius: 0.5vw; background: rgba(255,255,255,0.04); color: #b9c4d8;
    font: 700 1vw/1 "Microsoft JhengHei", sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6vw; }
  .seg button .icon { width: 1.8vw; height: 1.8vw; }
  .seg button:hover { color: #fff; }
  .seg button.sel { color: #fff; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 1vw -0.4vw var(--accent); }
  .rival-row { display: grid; grid-template-columns: auto 1fr; gap: 0.8vw; align-items: center; }
  .tools { display: flex; flex-direction: column; gap: 0.6vh; }
  .tool { width: 2.8vw; height: 2.8vw; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 0.5vw; color: #b9c4d8; cursor: pointer; }
  .tool:hover { color: #fff; border-color: var(--accent); }
  .tool .icon { width: 1.9vw; height: 1.9vw; }
  .modal .slots { gap: 0.6vw; min-width: 0; }
  .modal .slot { padding: 1vh 0.3vw; min-width: 0; }
  .modal .slot .icon { width: 4.4vw; height: 2.4vw; }
  .done { display: block; margin: 3vh 0 0 auto; padding: 1.4vh 3vw; border: 0; border-radius: 0.6vw; background: var(--accent); color: #fff;
    font: italic 900 1.2vw/1 system-ui, "Microsoft JhengHei", sans-serif; letter-spacing: 0.2vw; cursor: pointer; }

  /* What an icon means, on hover or keyboard focus (src/ui/tooltip.ts places it with Floating UI). */
  .tip { position: absolute; left: 0; top: 0; padding: 0.6vh 0.7vw; border-radius: 0.4vw; background: rgba(10, 14, 24, 0.96); border: 1px solid var(--accent);
    color: #eef3fb; font: 600 0.8vw/1.2 "Microsoft JhengHei", sans-serif; white-space: nowrap; pointer-events: none; opacity: 0;
    transition: opacity 0.12s; box-shadow: 0 0.4vh 1.2vw rgba(0,0,0,0.5); z-index: 100; }
  .tip.on { opacity: 1; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.8vw; }
  /* A rival: its colour is the slot's (top bar, numbered badge); the car is a white silhouette and its name - as in the car list. */
  .slot { position: relative; display: grid; grid-template-columns: 1.4vw 1fr 1.4vw; align-items: center; padding: 1vh 0.6vw; background: var(--glass);
    border: 1px solid var(--line); border-radius: 0.6vw; border-top: 0.35vh solid var(--c); backdrop-filter: blur(6px); }
  .slot .no { position: absolute; left: 0.5vw; top: 0.6vh; width: 1.2vw; height: 1.2vw; border-radius: 50%; background: var(--c); color: #0a0e18;
    font: 800 0.7vw/1.2vw system-ui, sans-serif; text-align: center; }
  .slot .arrow { color: #6f7d96; font-size: 1vw; text-align: center; cursor: pointer; }
  .slot .arrow:hover { color: #fff; }
  .slot .mid { text-align: center; }
  .slot .icon { width: 6vw; height: 3vw; color: #eef3fb; }
  .slot .name { font-size: 0.85vw; font-weight: 700; color: #cfd8e8; margin-top: 0.2vh; }
  .slot .remove { position: absolute; right: 0.4vw; top: 0.5vh; width: 1.3vw; height: 1.3vw; padding: 0; border: 0; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: #9fb0cc; font-size: 0.7vw; cursor: pointer; }
  .slot .remove:hover { background: #ff3b30; color: #fff; }
  .slot.empty { display: grid; grid-template-columns: 1fr; place-items: center; min-height: 9.6vh; border: 1px dashed rgba(255,255,255,0.22); background: transparent;
    color: #6f7d96; font-size: 1.8vw; cursor: pointer; }
  .slot.empty:hover { color: #fff; border-color: var(--accent); }
  .seg button[aria-disabled="true"] { opacity: 0.35; cursor: not-allowed; }
  .seg button[aria-disabled="true"]:hover { color: #b9c4d8; }
  .race .item.none .icon, .race .item.none .count { color: #6f7d96; }
  .go { flex: 0 0 15vw; height: 9vh; border: 0; border-radius: 0.7vw; background: var(--accent); color: #fff; cursor: pointer;
    font: italic 900 1.9vw/1 system-ui, "Microsoft JhengHei", sans-serif; letter-spacing: 0.3vw; box-shadow: 0 0 2.4vw -0.4vw var(--accent); }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="car"></canvas>
<div class="vignette"></div>

<div class="brand"><span class="icon" style="--src:url(/ui/emblem.png)"></span><div class="name">HIGHWAY THUNDER 2</div></div>

<div class="classes" id="classes"></div>
<div class="spec" id="spec"></div>

<div class="bottom">
  <button class="race" id="race" data-tip="修改比賽設定"></button>
  <button class="go">開始比賽</button>
</div>

<div class="back" id="back">
  <div class="modal" role="dialog" aria-modal="true" aria-label="比賽設定">
    <button class="close" id="close" data-tip="關閉" data-tip-place="left">✕</button>
    <div class="row">
      <span class="icon" style="--src:url(/ui/icon-rivals.png)" data-tip="對手" tabindex="0"></span>
      <div class="rival-row">
        <div class="tools">
          <button class="tool" id="all-random" data-tip="對手全部隨機"><span class="icon" style="--src:url(/ui/icon-random.png)"></span></button>
          <button class="tool" id="all-same" data-tip="對手全部和我同車種" data-tip-place="bottom"><span class="icon" style="--src:url(/ui/icon-same.png)"></span></button>
        </div>
        <div class="slots" id="slots"></div>
      </div>
    </div>
    <div class="row">
      <span class="icon" style="--src:url(/ui/icon-difficulty.png)" data-tip="難易度" tabindex="0"></span>
      <div class="seg" id="difficulty"></div>
    </div>
    <div class="row">
      <span class="icon" style="--src:url(/ui/icon-night-clear.png)" data-tip="天氣" tabindex="0"></span>
      <div class="seg" id="weather"></div>
    </div>
    <button class="done" id="done">完成</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { buildCar } from '/src/vehicles/models.ts';
  import { installTooltips } from '/src/ui/tooltip.ts';

  // The three cars, with their measured numbers (training/cornering.train.ts).
  const CARS = {
    'street-racer': { name: '超跑', style: 'super', color: 0xd62828, accent: '#ff3b30', tag: '加速快、極速最高', icon: 'icon-super',
      stats: [['icon-accel', '加速', '0–100 4.2 秒', 0.8], ['icon-topspeed', '極速', '300 km/h', 1], ['icon-handling', '操控', '2.1 g', 0.75]] },
    'muscle-car': { name: '肌肉車', style: 'muscle', color: 0x2b2f3a, accent: '#ff9f1a', tag: '加速最快、懸吊軟、容易甩尾', icon: 'icon-muscle',
      stats: [['icon-accel', '加速', '0–100 4.0 秒', 1], ['icon-topspeed', '極速', '259 km/h', 0.75], ['icon-handling', '操控', '1.4 g', 0.45]] },
    jdm: { name: '改裝車', style: 'jdm', color: 0x3a8dde, accent: '#2f9bff', tag: 'JDM 風格、轉彎最強、精準', icon: 'icon-jdm',
      stats: [['icon-accel', '加速', '0–100 4.0 秒', 0.75], ['icon-topspeed', '極速', '245 km/h', 0.6], ['icon-handling', '操控', '2.4 g', 1]] },
  };
  const RIVAL_COLORS = ['#1e88e5', '#ffb300', '#8e24aa', '#00c853', '#00bcd4'];
  // The rivals, 0 to MAX_RIVALS of them.
  const MAX_RIVALS = 5;
  const rivals = ['street-racer', 'muscle-car', 'jdm', 'street-racer', 'muscle-car'];
  const icon = (name, cls = '') => `<span class="icon ${cls}" style="--src:url(/ui/${name}.png)"></span>`;
  // What each stat icon means (its label is gone: shown on hover).
  const STAT_TIPS = { 'icon-accel': '加速（0–100 km/h）', 'icon-topspeed': '極速', 'icon-handling': '過彎抓地力' };
  let picked = new URLSearchParams(location.search).get('car') ?? 'street-racer';

  function draw() {
    const c = CARS[picked];
    document.documentElement.style.setProperty('--accent', c.accent);
    document.getElementById('classes').innerHTML = Object.entries(CARS).map(([id, k]) =>
      `<div class="cls ${id === picked ? 'sel' : ''}" data-id="${id}">${icon(k.icon, 'car')}<div class="t">${k.name}</div></div>`).join('');
    document.getElementById('spec').innerHTML = `
      <h1>${c.name}</h1>
      ${c.stats.map(([ic, , v, f]) => `<div class="stat"><span data-tip="${STAT_TIPS[ic]}" data-tip-place="left" tabindex="0">${icon(ic)}</span><span class="v">${v}</span><div class="bar"><i style="width:${f * 100}%"></i></div></div>`).join('')}`;
    document.querySelectorAll('.cls').forEach((e) => (e.onclick = () => { picked = e.dataset.id; draw(); showCar(); }));
    drawRace();
  }

  // The race at a glance (the button that opens the pop-up), and the pop-up.
  const DIFFICULTY = ['簡單', '普通', '困難', '極限'];
  const WEATHER = [['icon-night-clear', '晴夜'], ['icon-night-rain', '雨夜'], ['icon-night-fog', '霧夜']];
  let difficulty = 1;
  let weather = 0;
  const ids = Object.keys(CARS);
  function drawRace() {
    const lineUp = ids.filter((id) => rivals.includes(id)).map((id) =>
      `<span class="count" data-tip="${CARS[id].name}"><span class="icon mini" style="--src:url(/ui/${CARS[id].icon}.png)"></span>×${rivals.filter((r) => r === id).length}</span>`).join('');
    document.getElementById('race').innerHTML = `
      <span class="item ${lineUp ? '' : 'none'}">${icon('icon-rivals')}${lineUp || '<span class="count">×0</span>'}</span>
      <span class="sep"></span>
      <span class="item">${icon('icon-difficulty')}${DIFFICULTY[difficulty]}</span>
      <span class="sep"></span>
      <span class="item">${icon(WEATHER[weather][0])}${WEATHER[weather][1]}</span>
      <span class="edit">✎</span>`;
  }
  function drawModal() {
    // The rivals there are, from the left (number and colour by place), then one + while there is room.
    document.getElementById('slots').innerHTML =
      rivals.map((id, i) =>
        `<div class="slot" style="--c:${RIVAL_COLORS[i]}"><span class="no">${i + 1}</span><button class="remove" data-i="${i}" data-tip="移除對手">✕</button><span class="arrow" data-i="${i}" data-d="-1">◀</span><div class="mid">${icon(CARS[id].icon, 'car')}<div class="name">${CARS[id].name}</div></div><span class="arrow" data-i="${i}" data-d="1">▶</span></div>`).join('') +
      (rivals.length < MAX_RIVALS ? `<button class="slot empty" data-tip="加入對手">＋</button>` : '');
    const changed = () => { drawModal(); drawRace(); };
    document.querySelectorAll('.slot .arrow').forEach((a) => (a.onclick = () => {
      const i = Number(a.dataset.i);
      rivals[i] = ids[(ids.indexOf(rivals[i]) + Number(a.dataset.d) + ids.length) % ids.length];
      changed();
    }));
    document.querySelectorAll('.slot .remove').forEach((b) => (b.onclick = () => { rivals.splice(Number(b.dataset.i), 1); changed(); }));
    document.querySelectorAll('.slot.empty').forEach((b) => (b.onclick = () => { rivals.push(picked); changed(); }));
    document.getElementById('difficulty').innerHTML = DIFFICULTY.map((d, i) => `<button class="${i === difficulty ? 'sel' : ''}" data-i="${i}">${d}</button>`).join('');
    // Only the clear night for now: rain and fog are not in the game yet.
    document.getElementById('weather').innerHTML = WEATHER.map(([ic, w], i) =>
      // aria-disabled, not disabled: a disabled button gets no mouse events, so its tip would never show.
      `<button class="${i === weather ? 'sel' : ''}" data-i="${i}" ${i > 0 ? 'aria-disabled="true" data-tip="即將推出"' : ''}>${icon(ic)}${w}</button>`).join('');
    document.querySelectorAll('#difficulty button').forEach((b) => (b.onclick = () => { difficulty = Number(b.dataset.i); drawModal(); drawRace(); }));
    document.querySelectorAll('#weather button:not([aria-disabled])').forEach((b) => (b.onclick = () => { weather = Number(b.dataset.i); drawModal(); drawRace(); }));
  }
  const back = document.getElementById('back');
  const open = () => { drawModal(); back.classList.add('open'); };
  const close = () => back.classList.remove('open');
  document.getElementById('race').onclick = open;
  document.getElementById('close').onclick = close;
  document.getElementById('done').onclick = close;
  back.onclick = (e) => e.target === back && close();
  addEventListener('keydown', (e) => e.key === 'Escape' && close());
  // The shortcuts change the rivals there are (not how many).
  document.getElementById('all-random').onclick = () => { for (let i = 0; i < rivals.length; i++) rivals[i] = ids[Math.floor(Math.random() * ids.length)]; drawModal(); drawRace(); };
  document.getElementById('all-same').onclick = () => { rivals.fill(picked); drawModal(); drawRace(); };
  installTooltips();
  if (new URLSearchParams(location.search).has('open')) open();

  // The car itself: the game's own model, under the lamp, slowly turning.
  const canvas = document.getElementById('car');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 100);
  camera.position.set(0, 1.6, 17.5);
  camera.lookAt(0, 0.55, 0);
  scene.add(new THREE.HemisphereLight(0x6f86c8, 0x1a1208, 0.6));
  const lamp = new THREE.SpotLight(0xffb36b, 120, 30, 0.7, 0.6, 1.6);
  lamp.position.set(2.5, 7, 1);
  scene.add(lamp, lamp.target);
  const rim = new THREE.DirectionalLight(0x6fa8ff, 1.4);
  rim.position.set(-6, 3, -6);
  scene.add(rim);
  // A soft contact shadow: dark in the middle, fading out.
  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const sg = sc.getContext('2d');
  const grad = sg.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(0,0,0,0.85)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.5)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sg.fillStyle = grad;
  sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 5.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -0.64; // under the car (a child of it: it turns with it)
  let car = null;
  function showCar() {
    if (car) scene.remove(car);
    const c = CARS[picked];
    car = buildCar(1.86, 1.3, 4.4, c.color, c.style, true, false).root;
    car.position.y = 0.65;
    car.add(shadow);
    scene.add(car);
  }
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    // The car sits low in the middle of the screen, on the empty parking spot.
    camera.setViewOffset(innerWidth, innerHeight, 0, -innerHeight * 0.12, innerWidth, innerHeight);
  }
  addEventListener('resize', resize);
  resize();
  draw();
  showCar();
  const t0 = performance.now();
  renderer.setAnimationLoop((now) => {
    car.rotation.y = 2.3 + ((now - t0) / 1000) * 0.25 * (window.__spin ?? 1); // nose (-z) toward the camera, three-quarter
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
